server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The webfonts are served from this container's own fonts/ directory, so 'self' covers the
    # stylesheet and the woff2 files both. Google's two origins used to be named here because
    # index.html linked them; nothing does now, and font-src 'self' is what makes a
    # reintroduced third-party font request fail loudly instead of quietly working.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        # $remote_addr here is the docker gateway, not the visitor: overwriting the
        # chain collapsed every client into ONE rate-limit bucket, so 20 logins from
        # anyone locked out every customer. Append instead, and let client_ip() read
        # the hop this proxy trusts.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
    }

    location = /robots.txt {
        proxy_pass http://api:8000/api/public/robots.txt;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
    }

    location = /sitemap.xml {
        proxy_pass http://api:8000/api/public/sitemap.xml;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
