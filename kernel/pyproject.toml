[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-kernel"
version = "0.1.0"
description = "Shared evidence-desk kernel: Hub custody, USDC salt invoices, HMAC, cite packs, archive."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.2",
  "PyJWT>=2.9.0",
  "cryptography>=43.0.0",
  "apscheduler>=3.10.4",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.12",
  "fpdf2>=2.8.2",
  "pywebpush>=2.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[tool.setuptools.packages.find]
include = ["desk_kernel*"]

[tool.setuptools.package-data]
desk_kernel = ["service/fixtures/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
