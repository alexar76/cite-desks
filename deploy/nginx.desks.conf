# --- HTTPS: Emberline origin (the fire desk, not the family catalog) ---
server {
  listen 443 ssl;
  http2 on;
  server_name www.emberlinedesk.com;
  ssl_certificate     /etc/letsencrypt/live/emberlinedesk.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/emberlinedesk.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  add_header Strict-Transport-Security "max-age=31536000" always;
  return 301 https://emberlinedesk.com$request_uri;
}

