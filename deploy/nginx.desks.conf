# Cite-desks public demo vhosts for metis-nginx.
# Appended on the host to /opt/metis/deploy/nginx.conf — do not replace that file.
# Docroot lives under the existing metis-landing mount:
#   /var/www/metis-landing/cite-desks  →  /usr/share/nginx/html/cite-desks
#
# desk.modelmarket.dev   — family landing (the A record that exists; desks. is unset)
# emberlinedesk.com      — fire origin → emberline-web
# tideline|solrecord|seamark|plinth.modelmarket.dev — per-desk apps (NOT the family catalog)
#
# Parent modelmarket.dev sends HSTS includeSubDomains, so these names MUST
# present a matching certificate. The default 443 vhost is metis.modelmarket.dev.
# Shared SAN cert: desk.modelmarket.dev (+ tideline/solrecord/seamark/plinth/www.desk).

# --- HTTP ---
server {
  listen 80;
  server_name desk.modelmarket.dev www.desk.modelmarket.dev
              tideline.modelmarket.dev solrecord.modelmarket.dev
              seamark.modelmarket.dev plinth.modelmarket.dev
              emberlinedesk.com www.emberlinedesk.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: family landing only ---
server {
  listen 443 ssl;
  http2 on;
  server_name desk.modelmarket.dev www.desk.modelmarket.dev;
  ssl_certificate     /etc/letsencrypt/live/desk.modelmarket.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/desk.modelmarket.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  add_header Strict-Transport-Security "max-age=31536000" always;
  root /usr/share/nginx/html/cite-desks;
  index index.html;
  location = /sw.js {
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000" always;
    default_type application/javascript;
  }
  location / {
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ /index.html;
  }
}

# --- HTTPS: Tideline (flood desk) ---
server {
  listen 443 ssl;
  http2 on;
  server_name tideline.modelmarket.dev;
  ssl_certificate     /etc/letsencrypt/live/desk.modelmarket.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/desk.modelmarket.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 8m;
  location / {
    proxy_pass http://tideline-web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

