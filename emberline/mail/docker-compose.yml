# Lightweight desk mailbox on the Emberline host. Not part of the app compose.
#   cd /opt/mail && docker compose up -d
services:
  mail:
    image: foxcpp/maddy:0.7
    container_name: emberline-mail
    restart: unless-stopped
    mem_limit: 192m
    cpus: "0.50"
    environment:
      MADDY_HOSTNAME: emberlinedesk.com
      MADDY_DOMAIN: emberlinedesk.com
    volumes:
      - ./data:/data
      - ./maddy.conf:/data/maddy.conf:ro
      - ./aliases:/data/aliases:ro
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
