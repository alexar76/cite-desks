server {
    listen 80;
    server_name _;
    # Not /usr/share/nginx/html: that folder belongs to the nginx package, and on 2026-10-31 an
    # in-place package upgrade (OS security rollout) replaced our index.html with its welcome page.
    root /srv/emberline-web;
    include /etc/nginx/mime.types;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # Every page ends here (try_files, the index of /). Without a header browsers cache HTML by
    # heuristic, for days when Last-Modified is old; a wrong page then outlives its fix.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
