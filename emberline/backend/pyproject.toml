[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberline"
version = "0.1.0"
description = "Emberline — Fire Evidence Desk. Citeable thermal + weather briefs, not invented perimeters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emberline" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.2",
  "PyJWT>=2.9.0",
  "cryptography>=43.0.0",
  "apscheduler>=3.10.4",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.12",
  "fpdf2>=2.8.2",
  "pywebpush>=2.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# cite-desks/emberline/backend -> cite-desks/kernel. Resolves both in the monorepo and in
# the published family repo, whose root IS cite-desks/ (see scripts/satellite-map.yaml).
pythonpath = [".", "../../kernel"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
