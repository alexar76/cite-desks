# Smokeproof — Smoke Evidence Desk
# HMS containment + colocated air. Not a risk score.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smokeproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smokeproof}
      POSTGRES_DB: smokeproof
    volumes:
      - smokeproof_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smokeproof -d smokeproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Not root, no capabilities, no escalation. uid 10001 must own the volumes it writes.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ..
      dockerfile: kernel/Dockerfile
    environment:
      DESK_ID: smokeproof
      APP_ENV: ${APP_ENV:-development}
      DESK_MODE: ${DESK_MODE:-live}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8095}
      DATABASE_URL: postgresql://smokeproof:${POSTGRES_PASSWORD:-smokeproof}@db:5432/smokeproof
      JWT_SECRET: ${JWT_SECRET:-cite-desk-dev-secret-change-me}
      HUB_MODE: ${HUB_MODE:-fixture}
      HUB_URL: ${HUB_URL:-https://modelmarket.dev}
      HUB_API_KEY: ${HUB_API_KEY:-}
      HUB_PAYMENT_CHANNEL: ${HUB_PAYMENT_CHANNEL:-}
      HUB_PAYMENT_CHANNEL_SECRET: ${HUB_PAYMENT_CHANNEL_SECRET:-}
      # Second seller: ATLAS sells its own products and 404s on `gaia.*`, so a desk that
      # needs a sensor relay buys it from a hub that federates GAIA, with its own key.
      GAIA_HUB_URL: ${GAIA_HUB_URL:-}
      GAIA_HUB_API_KEY: ${GAIA_HUB_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      SCHEDULER_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8095}
      PAY_MODE: ${PAY_MODE:-fixture}
      PAY_MINT_SECRET: ${PAY_MINT_SECRET:-}
      PAY_BASE_ADDRESS: ${PAY_BASE_ADDRESS:-0x1111111111111111111111111111111111111111}
      # Optional extras, comma-separated. The built-in public Base endpoints always follow.
      PAY_BASE_RPC_URL: ${PAY_BASE_RPC_URL:-}
      PAY_SCAN_INTERVAL_SECONDS: ${PAY_SCAN_INTERVAL_SECONDS:-20}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/public/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: kernel/web/Dockerfile
    volumes:
      - ../kernel/web:/usr/share/nginx/html:ro
    ports:
      - "8095:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  smokeproof_pg:
