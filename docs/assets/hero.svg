<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Cite Desks  independent evidence desks</title>
  <desc id="d">Five independent evidence desks on AIMarket rails: Emberline fire, Tideline flood, Solrecord PV, Seamark AIS, Plinth campus  shared kernel, separate origins and claim classes.</desc>
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1016"/>
      <stop offset="55%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#0e1518"/>
    </linearGradient>
    <radialGradient id="gTeal" cx="82%" cy="12%" r="48%">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3dd6c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gEmber" cx="8%" cy="0%" r="42%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e85d04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3dd6c6" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#3dd6c6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3dd6c6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#void)"/>
  <rect width="1200" height="420" fill="url(#gTeal)"/>
  <rect width="1200" height="420" fill="url(#gEmber)"/>
  <!-- faint grid -->
  <g stroke="rgba(238,243,246,0.06)" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200"/>
    <path d="M200 0 V420 M400 0 V420 M600 0 V420 M800 0 V420 M1000 0 V420"/>
  </g>
  <text x="60" y="78" fill="#3dd6c6" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="4">INDEPENDENT · NOT AN AIMARKET BRAND</text>
  <text x="60" y="168" fill="#eef3f6" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" letter-spacing="-1.5">Cite Desks</text>
  <text x="60" y="218" fill="#b7c4cc" font-family="ui-sans-serif, Helvetica, sans-serif" font-size="22">Evidence you can cite  not perimeters, forecasts, or scores we invent.</text>
  <!-- shared kernel rail -->
  <rect x="60" y="268" width="1080" height="2" fill="url(#rail)"/>
  <text x="60" y="258" fill="#7d8b94" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">desk_kernel</text>
  <!-- five desks -->
  <g font-family="ui-sans-serif, Helvetica, sans-serif" font-size="15" font-weight="600">
    <circle cx="120" cy="330" r="10" fill="#e85d04"/>
    <text x="140" y="335" fill="#eef3f6">Emberline</text>
    <text x="140" y="354" fill="#7d8b94" font-size="12" font-weight="400">fire</text>

    <circle cx="340" cy="330" r="10" fill="#5b8def"/>
    <text x="360" y="335" fill="#eef3f6">Tideline</text>
    <text x="360" y="354" fill="#7d8b94" font-size="12" font-weight="400">flood</text>

    <circle cx="560" cy="330" r="10" fill="#f0b429"/>
    <text x="580" y="335" fill="#eef3f6">Solrecord</text>
    <text x="580" y="354" fill="#7d8b94" font-size="12" font-weight="400">PV</text>

    <circle cx="800" cy="330" r="10" fill="#3dd6c6"/>
    <text x="820" y="335" fill="#eef3f6">Seamark</text>
    <text x="820" y="354" fill="#7d8b94" font-size="12" font-weight="400">AIS</text>

    <circle cx="1020" cy="330" r="10" fill="#c4a574"/>
    <text x="1040" y="335" fill="#eef3f6">Plinth</text>
    <text x="1040" y="354" fill="#7d8b94" font-size="12" font-weight="400">site</text>
  </g>
</svg>
