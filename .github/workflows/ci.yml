# CI for the cite-desks FAMILY. The published repo is rooted here (not at emberline/),
# because every desk's backend imports `desk_kernel` from ../../kernel — a repo rooted at
# emberline/ left the kernel outside the checkout and the api job could not import it.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  emberline-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emberline/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Kernel is importable
        # Fail LOUDLY and specifically if the shared kernel is missing, rather than as an
        # opaque ModuleNotFoundError halfway through collection.
        run: python -c "import sys; sys.path.insert(0, '../../kernel'); import desk_kernel; print(desk_kernel.__file__)"
      - name: Test
        run: pytest

  emberline-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emberline/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: emberline/frontend/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
